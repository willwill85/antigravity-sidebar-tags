        <text x="12" y="21" fill="#374151" font-size="13" font-weight="500">smart_skip_ble</text>
        <rect x="114" y="9" width="56" height="16" rx="4" fill="#dbeafe" stroke="#93c5fd"/>
        <text x="120" y="20" fill="#2563eb" font-size="10" font-weight="500">硬件/固件</text>
