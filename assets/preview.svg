<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef2ff"/>
    </linearGradient>
    <filter id="winShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <filter id="popShadow" x="-10%" y="-10%" width="125%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="880" height="540" rx="16" fill="url(#bgGrad)"/>

  <!-- App Window Container -->
  <g filter="url(#winShadow)" transform="translate(36, 28)">
    <rect width="808" height="484" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

    <!-- Sidebar Background -->
    <path d="M 0 12 Q 0 0 12 0 L 340 0 L 340 484 L 12 484 Q 0 484 0 472 Z" fill="#f9fafb"/>
    <line x1="340" y1="0" x2="340" y2="484" stroke="#e5e7eb" stroke-width="1"/>

    <!-- macOS Traffic Lights -->
    <circle cx="22" cy="20" r="6" fill="#ef4444"/>
    <circle cx="42" cy="20" r="6" fill="#f59e0b"/>
    <circle cx="62" cy="20" r="6" fill="#10b981"/>

    <!-- Top Inbox / Start conversation -->
    <g transform="translate(16, 44)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
      <text x="24" y="16" fill="#4b5563" font-size="13" font-weight="500">Inbox</text>
      <text x="24" y="42" fill="#4b5563" font-size="13" font-weight="500">Start conversation</text>
    </g>

    <!-- Injected Tag Bar (#agy-project-tags-bar) -->
    <g transform="translate(14, 102)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
      <!-- Highlight ring indicating injected bar -->
      <rect x="-4" y="-6" width="318" height="62" rx="8" fill="#eff6ff" fill-opacity="0.55" stroke="#bfdbfe" stroke-dasharray="4 3"/>

      <!-- Row 1 of Tag Pills -->
      <!-- 全部 37 -->
      <g transform="translate(2, 0)">
        <rect width="54" height="22" rx="6" fill="#f3f4f6" stroke="#d1d5db"/>
        <text x="8" y="15" fill="#374151" font-size="11" font-weight="500">全部</text>
        <text x="35" y="15" fill="#6b7280" font-size="10">37</text>
      </g>

      <!-- 硬件/固件 9 (Active) -->
      <g transform="translate(62, 0)">
        <rect width="84" height="22" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
        <circle cx="10" cy="11" r="3" fill="#2563eb"/>
        <text x="17" y="15" fill="#2563eb" font-size="11" font-weight="600">硬件/固件</text>
        <text x="71" y="15" fill="#2563eb" font-size="10" font-weight="600">9</text>
      </g>

      <!-- 包装/设计 8 -->
      <g transform="translate(152, 0)">
        <rect width="84" height="22" rx="6" fill="#f3f4f6" stroke="#d1d5db"/>
        <circle cx="10" cy="11" r="3" fill="#db2777"/>
        <text x="17" y="15" fill="#374151" font-size="11" font-weight="500">包装/设计</text>
        <text x="71" y="15" fill="#6b7280" font-size="10">8</text>
      </g>

      <!-- AI媒体 5 -->
      <g transform="translate(242, 0)">
        <rect width="68" height="22" rx="6" fill="#f3f4f6" stroke="#d1d5db"/>
        <circle cx="10" cy="11" r="3" fill="#d97706"/>
        <text x="17" y="15" fill="#374151" font-size="11" font-weight="500">AI媒体</text>
        <text x="55" y="15" fill="#6b7280" font-size="10">5</text>
      </g>

      <!-- Row 2 of Tag Pills -->
      <!-- 软件/Web 8 -->
      <g transform="translate(2, 27)">
        <rect width="82" height="22" rx="6" fill="#f3f4f6" stroke="#d1d5db"/>
        <circle cx="10" cy="11" r="3" fill="#059669"/>
        <text x="17" y="15" fill="#374151" font-size="11" font-weight="500">软件/Web</text>
        <text x="69" y="15" fill="#6b7280" font-size="10">8</text>
      </g>

      <!-- 算法/数据 7 -->
      <g transform="translate(90, 27)">
        <rect width="84" height="22" rx="6" fill="#f3f4f6" stroke="#d1d5db"/>
        <circle cx="10" cy="11" r="3" fill="#7c3aed"/>
        <text x="17" y="15" fill="#374151" font-size="11" font-weight="500">算法/数据</text>
        <text x="71" y="15" fill="#6b7280" font-size="10">7</text>
      </g>

      <!-- + 标签 -->
      <g transform="translate(180, 27)">
        <rect width="50" height="22" rx="6" fill="#f3f4f6" stroke="#d1d5db"/>
        <text x="9" y="15" fill="#4b5563" font-size="11" font-weight="500">+ 标签</text>
      </g>
