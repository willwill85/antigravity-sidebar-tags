        <circle cx="32" cy="14" r="4" fill="#db2777"/>
        <text x="42" y="18" fill="#374151" font-size="12">包装/设计</text>
        <text x="198" y="18" fill="#9ca3af" font-size="11">删除</text>
      </g>

      <!-- Checklist Row 3 -->
      <g transform="translate(10, 100)">
        <rect x="8" y="7" width="14" height="14" rx="4" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
        <circle cx="32" cy="14" r="4" fill="#d97706"/>
        <text x="42" y="18" fill="#374151" font-size="12">AI媒体</text>
        <text x="198" y="18" fill="#9ca3af" font-size="11">删除</text>
      </g>

      <!-- Checklist Row 4 -->
      <g transform="translate(10, 132)">
        <rect x="8" y="7" width="14" height="14" rx="4" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
        <circle cx="32" cy="14" r="4" fill="#059669"/>
        <text x="42" y="18" fill="#374151" font-size="12">软件/Web</text>
        <text x="198" y="18" fill="#9ca3af" font-size="11">删除</text>
      </g>

      <!-- Checklist Row 5 -->
      <g transform="translate(10, 164)">
        <rect x="8" y="7" width="14" height="14" rx="4" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
        <circle cx="32" cy="14" r="4" fill="#7c3aed"/>
        <text x="42" y="18" fill="#374151" font-size="12">算法/数据</text>
        <text x="198" y="18" fill="#9ca3af" font-size="11">删除</text>
      </g>

      <!-- Divider -->
      <line x1="12" y1="202" x2="240" y2="202" stroke="#e2e8f0" stroke-width="1"/>

      <!-- Create Tag Input + Button -->
      <rect x="12" y="212" width="174" height="26" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="20" y="229" fill="#9ca3af" font-size="11">新建标签名称...</text>
      <rect x="192" y="212" width="48" height="26" rx="6" fill="#2563eb"/>
      <text x="205" y="229" fill="#ffffff" font-size="11" font-weight="500">添加</text>

      <!-- Color Swatches -->
      <g transform="translate(16, 250)">
        <circle cx="6" cy="6" r="7" fill="#2563eb" stroke="#1e293b" stroke-width="2"/>
        <circle cx="28" cy="6" r="6" fill="#db2777"/>
        <circle cx="48" cy="6" r="6" fill="#d97706"/>
        <circle cx="68" cy="6" r="6" fill="#059669"/>
        <circle cx="88" cy="6" r="6" fill="#7c3aed"/>
        <circle cx="108" cy="6" r="6" fill="#dc2626"/>
        <circle cx="128" cy="6" r="6" fill="#0891b2"/>
        <circle cx="148" cy="6" r="6" fill="#4f46e5"/>
      </g>
    </g>

    <!-- Connector Arrow from Tag Badge to Popover -->
    <path d="M 300 220 C 335 220, 335 160, 364 160" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="4 3"/>
  </g>
</svg>
