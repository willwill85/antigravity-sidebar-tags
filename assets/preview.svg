    <!-- Projects Header -->
    <g transform="translate(22, 178)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
      <text x="0" y="12" fill="#6b7280" font-size="12" font-weight="500">Projects</text>
      <text x="275" y="13" fill="#6b7280" font-size="14">🔍  ＋</text>
