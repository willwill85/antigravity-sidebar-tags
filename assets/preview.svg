    <!-- Filtered Project List -->
    <g transform="translate(14, 204)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
      <!-- Project Row 1 (Hovered/Selected) -->
      <g transform="translate(0, 0)">
        <rect width="312" height="34" rx="7" fill="#eff6ff"/>
        <text x="12" y="21" fill="#111827" font-size="13" font-weight="600">esp32</text>
        <!-- Tag Badge -->
        <rect x="58" y="9" width="56" height="16" rx="4" fill="#dbeafe" stroke="#93c5fd"/>
        <text x="64" y="20" fill="#2563eb" font-size="10" font-weight="500">硬件/固件</text>
        <!-- Hover Tag Icon + Plus -->
        <rect x="262" y="6" width="22" height="22" rx="5" fill="#dbeafe"/>
        <text x="267" y="21" fill="#2563eb" font-size="12">🏷️</text>
        <text x="291" y="21" fill="#4b5563" font-size="14">＋</text>
      </g>

      <!-- Project Row 2 -->
      <g transform="translate(0, 38)">
        <text x="12" y="21" fill="#374151" font-size="13" font-weight="500">icm42688</text>
        <rect x="82" y="9" width="56" height="16" rx="4" fill="#dbeafe" stroke="#93c5fd"/>
        <text x="88" y="20" fill="#2563eb" font-size="10" font-weight="500">硬件/固件</text>
        <rect x="142" y="9" width="56" height="16" rx="4" fill="#ede9fe" stroke="#c4b5fd"/>
        <text x="148" y="20" fill="#7c3aed" font-size="10" font-weight="500">算法/数据</text>
      </g>

      <!-- Project Row 3 -->
      <g transform="translate(0, 76)">
        <text x="12" y="21" fill="#374151" font-size="13" font-weight="500">imu_ble</text>
        <rect x="70" y="9" width="56" height="16" rx="4" fill="#dbeafe" stroke="#93c5fd"/>
        <text x="76" y="20" fill="#2563eb" font-size="10" font-weight="500">硬件/固件</text>
      </g>

      <!-- Project Row 4 -->
      <g transform="translate(0, 114)">
        <text x="12" y="21" fill="#374151" font-size="13" font-weight="500">ota_tool</text>
        <rect x="72" y="9" width="56" height="16" rx="4" fill="#dbeafe" stroke="#93c5fd"/>
        <text x="78" y="20" fill="#2563eb" font-size="10" font-weight="500">硬件/固件</text>
      </g>

      <!-- Project Row 5 -->
      <g transform="translate(0, 152)">
        <text x="12" y="21" fill="#374151" font-size="13" font-weight="500">C81_ble_ota</text>
        <rect x="96" y="9" width="56" height="16" rx="4" fill="#dbeafe" stroke="#93c5fd"/>
        <text x="102" y="20" fill="#2563eb" font-size="10" font-weight="500">硬件/固件</text>
      </g>

