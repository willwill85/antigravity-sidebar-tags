      <rect width="252" height="270" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
      <text x="14" y="24" fill="#4b5563" font-size="11" font-weight="600">项目标签：esp32</text>
      <text x="228" y="24" fill="#9ca3af" font-size="12">✕</text>

      <!-- Checklist Row 1 (Checked) -->
      <g transform="translate(10, 36)">
        <rect width="232" height="28" rx="6" fill="#f8fafc"/>
        <rect x="8" y="7" width="14" height="14" rx="4" fill="#2563eb"/>
        <text x="11" y="18" fill="#ffffff" font-size="10" font-weight="700">✓</text>
        <circle cx="32" cy="14" r="4" fill="#2563eb"/>
        <text x="42" y="18" fill="#111827" font-size="12" font-weight="500">硬件/固件</text>
        <text x="198" y="18" fill="#9ca3af" font-size="11">删除</text>
